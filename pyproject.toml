[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-research"
version = "2.0.0"
description = "Explainable heart disease classification and affordable prospective CHD risk research"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.4", "pandas==2.2.3", "scikit-learn==1.8.0",
  "scipy==1.16.3", "joblib==1.5.3", "matplotlib==3.10.8",
  "shap==0.50.0", "streamlit==1.44.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "ruff>=0.11,<1"]

[project.scripts]
heart-research = "heart_research.cli:main"
heart-risk = "heart_research.risk:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

